spring.application.name=EduManager-API

# Server Port (React will call http://localhost:8080)
server.port=8080

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/edumanager_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=asas

# Hibernate (Auto-creates the database tables based on your Java Classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect