spring.application.name=EduManager-API
spring.config.import=optional:file:.env[.properties]

# Server Port (React will call http://localhost:8080)
server.port=${SERVER_PORT:8080}

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edumanager_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate (Auto-creates the database tables based on your Java Classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Frontend URL used in password reset emails
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# SMTP configuration from environment variables
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dev helper: show explicit "email not found" on forgot-password
app.auth.forgot-password.reveal-email-not-found=true
